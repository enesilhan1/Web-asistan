<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>Web Asistanı önizleme</title>
  <!--
    Popup'ı eklenti olarak yüklemeden tarayıcıda denemek için. Sahte chrome
    API'si kurar, arka plan döngüsünü (gerçek Asistan sınıfı) sahte bir Claude
    yanıtıyla çalıştırır. Proje kökünden bir HTTP sunucusuyla açılmalı:
      python -m http.server 8123   →   http://localhost:8123/test/onizleme.html
    ?anahtar=0 → API anahtarı girilmemiş hali, ?hata=1 → API hatası,
    ?izin=0 → site erişim izni verilmemiş hali, ?senaryo=gezinme → başka siteye
    gitme (onay kartında uydurulmuş adres uyarısı), ?senaryo=baglanti → açık
    sekmedeki bağlantıyı açma (onay kartında kaynak).
  -->
  <style>
    html { background: #888; }
    body { margin: 20px auto !important; box-shadow: 0 6px 30px rgba(0,0,0,.35); }
  </style>
</head>
<body>
<script type="module">
  // Not: src/tarayici.js yüklenirken API nesnesini okur; bu yüzden modüller
  // aşağıda sahte API kurulduktan sonra dinamik olarak yüklenir.
  const parametre = new URLSearchParams(location.search);

  // --- chrome.storage.local (değişiklik olaylarıyla)
  const veri = {};
  const dinleyiciler = [];
  const kopya = (v) => (v === undefined ? undefined : structuredClone(v));
  const alan = {
    get: async (k) => (k in veri ? { [k]: kopya(veri[k]) } : {}),
    set: async (o) => {
      const d = {};
      for (const [k, v] of Object.entries(o)) {
        d[k] = { oldValue: kopya(veri[k]), newValue: kopya(v) };
        veri[k] = kopya(v);
      }
      setTimeout(() => dinleyiciler.forEach((f) => f(d, 'local')));
    },
    remove: async (k) => {
      const d = { [k]: { oldValue: kopya(veri[k]) } };
      delete veri[k];
      setTimeout(() => dinleyiciler.forEach((f) => f(d, 'local')));
    },
  };

  // --- sahte sekmeler, geçmiş ve Claude
  const sekmeler = [
    { id: 11, windowId: 1, active: true, title: 'Yapay zekâ haberleri — Örnek Haber', url: 'https://haber.example/yz' },
    { id: 12, windowId: 1, active: false, title: 'GitHub', url: 'https://github.com/' },
  ];
  const tarayici = {
    tabs: {
      query: async (q) => (q.active ? [sekmeler[0]] : sekmeler),
      get: async (id) => sekmeler.find((s) => s.id === id),
    },
    windows: { getLastFocused: async () => ({ id: 1 }) },
    scripting: {
      executeScript: async () => [{ result: { baslik: sekmeler[0].title, url: sekmeler[0].url, dil: 'tr', aciklama: '', secim: '', metin: 'Yeni model duyuruldu. Fiyatlar düştü.', baglantilar: [{ metin: 'Kurulum rehberi', url: 'https://docs.ornek.org/kurulum/rehber' }] } }],
    },
    history: { search: async () => [] },
  };
  let tur = 0;
  const gezinme = parametre.get('senaryo') === 'gezinme';
  // Önce açık sekmeyi okur, sonra oradaki bağlantıyı açmak ister (kaynak gösterimi).
  const baglantiSenaryosu = parametre.get('senaryo') === 'baglanti';
  const sahteFetch = async (adres, secenek = {}) => {
    // Araçların sayfa indirmeleri (GET): sahte bir rehber sayfası.
    if (secenek.method !== 'POST') {
      const html = `<html lang="tr"><head><title>Kurulum rehberi</title></head><body><h1>Kurulum</h1>
        <p>${'Adım adım kurulum anlatımı. '.repeat(30)}</p><a href="/sss">SSS</a></body></html>`;
      return new Response(html, { status: 200, headers: { 'content-type': 'text/html' } });
    }
    // Gerçek fetch gibi durdurulunca hemen iptal olur.
    await new Promise((coz, reddet) => {
      const z = setTimeout(coz, Number(parametre.get('gecikme') ?? 900));
      secenek.signal?.addEventListener('abort', () => {
        clearTimeout(z);
        reddet(new DOMException('aborted', 'AbortError'));
      });
    });
    const govde = JSON.parse(secenek.body);
    if (parametre.get('hata') === '1') {
      return new Response(JSON.stringify({ error: { message: 'invalid x-api-key' } }), { status: 401 });
    }
    const sonMesaj = govde.messages.at(-1);
    const aracSonucu = Array.isArray(sonMesaj.content) && sonMesaj.content[0]?.type === 'tool_result';
    tur++;
    const icerik = baglantiSenaryosu
      ? tur === 1
        ? [{ type: 'tool_use', id: 't1', name: 'sekmeyi_oku', input: { sekme_id: 11 } }]
        : tur === 2
          ? [{ type: 'tool_use', id: 't2', name: 'sayfayi_ac', input: { url: 'https://docs.ornek.org/kurulum/rehber' } }]
          : [{ type: 'text', text: 'Sayfadaki rehber bağlantısını açıp okudum.' }]
      : aracSonucu
      ? [{ type: 'text', text: gezinme
          ? 'Rehbere baktım: kurulum **adım adım** anlatılıyor; ayrıca bir SSS sayfası var.'
          : '## Özet\nSayfada iki ana nokta var:\n- **Yeni model** duyuruldu\n- Fiyatlar `düştü`\n\nKaynak: *Örnek Haber* sekmesi.' }]
      : gezinme
        ? [{ type: 'tool_use', id: `t${tur}`, name: 'sayfayi_ac', input: { url: 'https://docs.ornek.org/kurulum/rehber?surum=2' } }]
        : [{ type: 'tool_use', id: `t${tur}`, name: 'sekmeyi_oku', input: { sekme_id: 11 } }];
    return new Response(JSON.stringify({
      content: icerik,
      stop_reason: icerik[0].type === 'tool_use' ? 'tool_use' : 'end_turn',
      usage: { input_tokens: 1800, output_tokens: 120 },
    }), { status: 200 });
  };

  let izinVar = parametre.get('izin') !== '0';
  const izinDinleyicileri = [];
  let asistan;
  window.chrome = {
    storage: { local: alan, onChanged: { addListener: (f) => dinleyiciler.push(f) } },
    permissions: {
      contains: async () => izinVar,
      request: async () => {
        izinVar = true;
        izinDinleyicileri.forEach((f) => f());
        return true;
      },
      onAdded: { addListener: (f) => izinDinleyicileri.push(f) },
      onRemoved: { addListener: () => {} },
    },
    runtime: {
      id: 'onizleme',
      sendMessage: async (m) => {
        if (m.tur === 'gonder') {
          try {
            const { sohbetId } = await asistan.gonder(m.sohbetId ?? null, m.metin);
            return { sohbetId };
          } catch (e) {
            return { hata: e.message };
          }
        }
        if (m.tur === 'durdur') asistan.durdur(m.sohbetId);
        if (m.tur === 'onay') asistan.karar(m.onayId, m.kabul === true);
        return {};
      },
    },
  };
  tarayici.permissions = window.chrome.permissions;

  const { Asistan } = await import('../src/asistan.js');
  const { Depo } = await import('../src/depo.js');
  const depo = new Depo(alan);
  if (parametre.get('anahtar') !== '0') {
    await depo.ayarlariGuncelle((a) => ({ ...a, anahtarlar: { anthropic: 'sk-ant-onizleme' } }));
  }
  asistan = new Asistan({ depo, tarayici, fetch: sahteFetch, tekrarBeklemesiMs: 1 });

  // popup.html'in gövdesini ve stilini bu sayfaya al, sonra popup.js'i yükle.
  const html = await (await fetch('../popup/popup.html')).text();
  const belge = new DOMParser().parseFromString(html, 'text/html');
  const stil = document.createElement('link');
  stil.rel = 'stylesheet';
  stil.href = '../popup/popup.css';
  document.head.append(stil);
  document.body.innerHTML = belge.body.innerHTML;
  await new Promise((r) => (stil.onload = r));
  await import('../popup/popup.js');
</script>
</body>
</html>
